<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDPython</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery UI CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.css" rel="stylesheet">

    <!-- Alertify CSS -->
    <link href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" rel="stylesheet"/>
    <link href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css" rel="stylesheet"/>
    
    <!-- Estilos personalizados -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e1e2f;
            color: #f8f9fa;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> CuviPoP</a>
            <div class="collapse navbar-collapse" id="mnxAcademica">
                <div class="navbar-nav">
                    <a class="nav-link" href="#" data-form="inicio">Inicio</a>
                    <a class="nav-link" href="#" data-form="menu">Menú</a>
                    <a class="nav-link" href="#" data-form="pedidos">Pedidos</a>
                    <a class="nav-link" href="#" data-form="empleados">Empleados</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-fluid">

        <div id="inicio" class="mb-3"></div>
        <div id="menu" class="mb-3"></div>



        <div id="pedidos" class="ventana"></div>
      <div id="busqueda_pedidos" class="ventana"></div>
      <div id="empleados" class="ventana"></div>
      <div id="busqueda_empleados" class="ventana"></div>
      <div id="productos" class="ventana"></div>
      <div id="busqueda_productos" class="ventana"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js" integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", event=>{
            mnxAcademica.addEventListener('click', e=>{
                e.preventDefault();
                
                let form = e.target.dataset.form;
                abrirVentana(form);
            });
        });
        function abrirVentana(form, callback){
            if( $(`#${form} > form`).length === 0 ){
                fetch(`/vistas?form=${form}`)
                .then(response => response.text())
                .then(ventana => {
                    $(`#${form}`).html(ventana).draggable();
                    cerrarVentana();
                    if(callback) callback();
                })
                .catch(error => console.error('Error al cargar el formulario:', error));
            }else{
                $(`#${form}`).show();
            }
        }
        function cerrarVentana(){
            $('.btn-close').off('click').click(e=>{
                let form = e.target.dataset.form;
                $(`#${form}`).hide();
            });
        }
    </script>
</body>
</html>
