<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Cuvi - Python</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
       crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <!-- Semantic UI theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <!-- Bootstrap theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cuvi</a>
            <div class="collapse navbar-collapse" id="mnxPedidos">
                <div class="navbar-nav">
                    <a class="nav-link" href="#" data-form="pedidos">Pedidos</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                    <a class="nav-link" href="#" data-form="empleados">Empleados</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <!-- Contenedores para mostrar los formularios y búsquedas -->
        <div class="position-absolute" id="pedidos"></div>
        <div class="position-absolute" id="busqueda_pedidos"></div>
        
        <div class="position-absolute" id="productos"></div>
        <div class="position-absolute" id="busqueda_productos"></div>
        
        <div class="position-absolute" id="empleados"></div>
        <div class="position-absolute" id="busqueda_empleados"></div>
    </div>
</body>
</html>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js" integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    
    
    <script>
        document.addEventListener("DOMContentLoaded", event=>{
            mnxPedidos.addEventListener('click', e=>{
                e.preventDefault();
                
                let form = e.target.dataset.form;
                abrirVentana(form);
            });
        });
        
       function abrirVentana(form, callback){
    let $ventana = $(`#${form}`);

    // Si nunca se cargó la ventana, la carga desde el servidor
    if( $ventana.find('> form').length === 0 ){
        fetch(`/vistas?form=${form}`)
        .then(response => response.text())
        .then(ventana => {
            $ventana.html(ventana).draggable().show();
            // Inicializar botones cada vez que se carga
            cerrarVentana();
            minimizarVentana();
            if(callback) callback();
        })
        .catch(error => console.error('Error al cargar el formulario:', error));
    } else {
        // Si ya existe, restaurar si estaba minimizada
        if ($ventana.hasClass('minimizado')) {
            $ventana.removeClass('minimizado').css({
                width: '',
                height: '',
                opacity: 1,
                overflow: ''
            });
            $ventana.find('form, .contenido').show();
        }
        // Mostrar siempre la ventana y traer al frente
        $ventana.show().css({ zIndex: 9999 });

        // Reasignar eventos de cerrar/minimizar
        cerrarVentana();
        minimizarVentana();
    }
}


       function cerrarVentana() {
    $('.btn-close').off('click').click(e => {
        let form = e.target.dataset.form;
        let $ventana = $(`#${form}`);
        $ventana.fadeOut(200, function() {
            $ventana.html(''); // se elimina después del efecto
        });
    });
}




    function minimizarVentana() {
    $('.btn-minimizar').off('click').click(e => {
        let form = e.target.dataset.form;
        let $ventana = $(`#${form}`);

        if ($ventana.hasClass('minimizado')) {
            // Restaurar ventana
            $ventana.removeClass('minimizado').css({
                width: '',
                height: '',
                opacity: 1,
                overflow: ''
            });
            $ventana.find('.contenido, form').show();
        } else {
            // Minimizar ventana
            $ventana.addClass('minimizado').css({
                width: '250px',
                height: '40px',
                opacity: 0.8,
                overflow: 'hidden'
            });
            $ventana.find('.contenido, form').hide();
        }
    });
}




    </script>
    
</body>
</html>
