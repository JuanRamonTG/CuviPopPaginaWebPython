<form id="frmEmpleados"> 
    <div class="card text-bg-dark" style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">
                ADMINISTRACION DE EMPLEADOS
                <div class="ms-auto">
                    <button data-form="empleados" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-4">
                    <input required type="text" id="txtNombreEmpleado" name="txtNombreEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">CARGO</div>
                <div class="col-9 col-md-3">
                    <input required type="text" id="txtCargoEmpleado" name="txtCargoEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">EMAIL</div>
                <div class="col-9 col-md-4">
                    <input type="email" id="txtEmailEmpleado" name="txtEmailEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">TELÉFONO</div>
                <div class="col-9 col-md-3">
                    <input type="text" id="txtTelefonoEmpleado" name="txtTelefonoEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">USUARIO</div>
                <div class="col-9 col-md-3">
                    <input required type="text" id="txtUsuarioEmpleado" name="txtUsuarioEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">CONTRASEÑA</div>
                <div class="col-9 col-md-3">
                    <input required type="password" id="txtContrasenaEmpleado" name="txtContrasenaEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">ESTADO</div>
                <div class="col-9 col-md-3">
                    <input required type="text" id="txtEstadoEmpleado" name="txtEstadoEmpleado" class="form-control form-control-sm" />
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" id="btnGuardarEmpleado" name="btnGuardarEmpleado" class="btn btn-outline-primary" value="GUARDAR" />
            <input type="reset" id="btnNuevoEmpleado" name="btnNuevoEmpleado" class="btn btn-outline-warning" value="NUEVO" />
            <input type="button" id="btnBuscarEmpleado" name="btnBuscarEmpleado" class="btn btn-outline-info" value="BUSCAR" />
        </div>
    </div>
</form>

<script>

var accion = "nuevo",
    idEmpleado = 0;
frmEmpleados.addEventListener("submit", e => {
    e.preventDefault();
    guardarEmpleados();
}); 
async function guardarEmpleados(){
    let datos = {
        accion,
        idEmpleado,
        nombre: txtNombreEmpleado.value,
        cargo: txtCargoEmpleado.value,
        email: txtEmailEmpleado.value,
        telefono: txtTelefonoEmpleado.value,
        usuario: txtUsuarioEmpleado.value,
        contrasena: txtContrasenaEmpleado.value,
        estado: txtEstadoEmpleado.value
    };
    let response = await fetch("/empleados", {
        method: "POST",
        body: JSON.stringify(datos),
    }), 
    respuesta = await response.json();

    if(respuesta.msg != "ok"){
        alertify.error(`Error al procesar empleado: ${respuesta}`);
        return;
    }
    limpiarFormulario();
    obtenerEmpleados();
}

function limpiarFormulario(){
    accion = "nuevo";
    idEmpleado = 0;
    txtNombreEmpleado.value = "";
    txtCargoEmpleado.value = "";
    txtEmailEmpleado.value = "";
    txtTelefonoEmpleado.value = "";
    txtUsuarioEmpleado.value = "";
    txtContrasenaEmpleado.value = "";
    txtEstadoEmpleado.value = "";
}

function mostrarEmpleado(empleado){
    accion = "modificar";
    idEmpleado = empleado.idEmpleado;
    txtNombreEmpleado.value = empleado.nombre;
    txtCargoEmpleado.value = empleado.cargo;
    txtEmailEmpleado.value = empleado.email;
    txtTelefonoEmpleado.value = empleado.telefono;
    txtUsuarioEmpleado.value = empleado.usuario;
    txtContrasenaEmpleado.value = empleado.contrasena;
    txtEstadoEmpleado.value = empleado.estado;
    alertify.success(`Empleado ${empleado.nombre} cargado para editar`);
}

btnBuscarEmpleado.addEventListener("click", e => {
    e.preventDefault();
    abrirVentana('busqueda_empleados');
}); 


</script>
